[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

# Per-search link previews (title/description from the search keyword + city).
[[edge_functions]]
  path = "/search"
  function = "search-preview"

# Contact and storefront links use their own photo, title, and description.
[[edge_functions]]
  path = "/kontak/*"
  function = "detail-preview"

[[edge_functions]]
  path = "/catalog"
  function = "detail-preview"

[[edge_functions]]
  path = "/catalog/*"
  function = "detail-preview"

# SPA fallback — all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
