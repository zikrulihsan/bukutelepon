<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CariKontak.id - Direktori kontak publik berbasis kota di Indonesia" />
  <title>CariKontak.com - Berbagi Kemudahan</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" as="image" href="/hero-sumbawa-v2.webp" type="image/webp" fetchpriority="high" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0d3b2e" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CariKontak" />

  <!-- Android / Chrome -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Link preview (Open Graph + Twitter)
       Kept in the compact single-line shape: chat apps only expand a preview
       into the big square card when the image is large, so the thumbnail stays
       a small 192px square. /search gets its own per-keyword tags from the
       netlify/edge-functions/search-preview.ts edge function. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CariKontak" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:title" content="CariKontak — Direktori Kontak Kota" />
  <meta property="og:description" content="Temukan dan bagikan kontak penting di kotamu." />
  <meta property="og:url" content="https://carikontak.com/" />
  <meta property="og:image" content="https://carikontak.com/og-thumb.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="192" />
  <meta property="og:image:height" content="192" />
  <meta property="og:image:alt" content="CariKontak" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="CariKontak — Direktori Kontak Kota" />
  <meta name="twitter:description" content="Temukan dan bagikan kontak penting di kotamu." />
  <meta name="twitter:image" content="https://carikontak.com/og-thumb.jpg" />
</head>

<body class="bg-[#f4f7f6] text-gray-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
