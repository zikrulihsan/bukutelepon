name: Verify Prisma migrations

on:
  pull_request:
    paths:
      - "prisma/**"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://localhost/db
          DIRECT_URL: postgresql://localhost/db
